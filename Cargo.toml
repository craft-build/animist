[package]
name = "animist"
description = "Model inference and agent building for the Craft ecosystem"
license = "Apache-2.0"
repository = "https://github.com/craft-build/animist"
authors = ["Jarrett Tierney <akarifur@pm.me>"]
version = "0.1.0"
edition = "2024"

[dependencies]
arc-handle = "1"
async-trait = "0.1"
barkml = "0.10"
reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
snafu = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
