[package]
name = "animist"
description = "Model inference and agent building for the Craft ecosystem"
license = "Apache-2.0"
repository = "https://github.com/craft-build/animist"
authors = ["Jarrett Tierney <akarifur@pm.me>"]
version = "0.2.0"
edition = "2024"

[features]
default = []
bedrock = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-types",
    "dep:bytes",
    "dep:http",
    "dep:url",
]

[dependencies]
arc-handle = "1"
async-trait = "0.1"
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sigv4 = { version = "1", optional = true }
aws-types = { version = "1", optional = true }
base64 = "0.23"
bon = "3"
bytes = { version = "1", optional = true }
flume = "0.12"
http = { version = "1", optional = true }
macro_rules_attribute = "0.2"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = { version = "2", optional = true }

[dev-dependencies]
time = "0.3"
