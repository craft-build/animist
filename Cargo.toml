[package]
name = "animist"
description = "Model inference and agent building for the Craft ecosystem"
license = "Apache-2.0"
repository = "https://github.com/craft-build/animist"
authors = ["Jarrett Tierney <akarifur@pm.me>"]
version = "0.1.0"
edition = "2024"

[dependencies]
arc-handle = "1"
async-trait = "0.1"
base64 = "0.23"
barkml = "0.10"
bon = "3"
flume = "0.12.0"
macro_rules_attribute = "0.2"
reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
snafu = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
